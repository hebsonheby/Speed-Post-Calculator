<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Crafterina - Speed Post Calculator</title>
    <!-- Import cursive font for the logo -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-sage: #a1ab89; /* Matches logo background */
            --dark-sage: #75805c;    /* For text and contrast */
            --hover-sage: #8b9573;   /* For button hover */
            --light-bg: #f4f5f0;     /* Soft background */
            --border-color: #d1d6c5; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            max-width: 500px;
            width: 100%;
        }
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }
        
        /* CSS-Only Logo Styles */
        .css-logo {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            background-color: var(--primary-sage);
            border-radius: 50%;
            border: 2px solid white;
            padding: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .css-logo-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-sizing: border-box;
        }
        .logo-cursive {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4em;
            line-height: 0.9;
            margin-bottom: 12px;
            transform: rotate(-2deg);
        }
        .logo-sans {
            font-family: 'Georgia', serif;
            font-size: 0.55em;
            letter-spacing: 2px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        h2 {
            color: var(--dark-sage);
            margin: 0 0 5px 0;
            font-size: 1.4em;
        }
        p.subtitle {
            font-size: 0.9em;
            color: #777;
            margin: 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark-sage);
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-sage);
        }
        input[readonly] {
            background-color: var(--light-bg);
            color: #666;
            cursor: not-allowed;
            border: 1px solid var(--border-color);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-sage);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--hover-sage);
        }
        button:active {
            transform: scale(0.98);
        }
        .status-msg {
            font-size: 0.85em;
            color: var(--dark-sage);
            margin-top: 6px;
            min-height: 15px;
            font-style: italic;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--light-bg);
            border-left: 5px solid var(--primary-sage);
            border-radius: 6px;
            display: none;
        }
        .result-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--dark-sage);
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.05em;
        }
        .highlight {
            font-weight: bold;
            color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="css-logo">
            <div class="css-logo-inner">
                <div class="logo-cursive">
                    Craft<br>crafterina
                </div>
                <div class="logo-sans">
                    Handmade<br>Creations
                </div>
            </div>
        </div>

        <h2>Speed Post Calculator</h2>
        <p class="subtitle">Retail & Business Rates (inclusive of GST)</p>
    </div>

    <div class="form-group">
        <label for="originPin">Origin Pincode</label>
        <input type="number" id="originPin" value="679536" readonly>
    </div>

    <div class="form-group">
        <label for="destPin">Destination Pincode</label>
        <input type="tel" id="destPin" placeholder="Enter 6-digit Pincode" maxlength="6">
        <div id="pinStatus" class="status-msg"></div>
    </div>

    <div class="form-group">
        <label for="zoneSelect">Shipping Zone</label>
        <select id="zoneSelect">
            <option value="0">Local</option>
            <option value="1">Within State</option>
            <option value="2">Zone / Metro</option>
            <option value="3">Other States</option>
        </select>
        <div class="status-msg">Auto-selected based on Pincodes. Adjust if needed.</div>
    </div>

    <div class="form-group">
        <label for="weight">Parcel Weight (grams)</label>
        <input type="tel" id="weight" placeholder="e.g., 1500">
    </div>

    <button onclick="calculateRates()">Calculate Shipping</button>

    <div id="resultBox" class="result-box">
        <div class="result-title">Estimated Charges</div>
        <div class="result-item">
            <span>Speed Post (Retail):</span>
            <span id="resSpeedPostRetail" class="highlight">₹0</span>
        </div>
        <div class="result-item">
            <span>Speed Post (Business):</span>
            <span id="resSpeedPostBusiness" class="highlight">₹0</span>
        </div>
    </div>
</div>

<script>
    const ratesData = {
        // Updated data specifically transcribing Speed Post Retail from the new image
        speedPostRetail: [
            {w: 500, r: [34, 90, 96, 106]}, {w: 1000, r: [56, 119, 161, 169]}, {w: 1500, r: [70, 154, 214, 270]}, 
            {w: 2000, r: [103, 210, 300, 377]}, {w: 3000, r: [136, 287, 419, 532]}, {w: 4000, r: [171, 352, 521, 600]}, 
            {w: 5000, r: [206, 425, 637, 810]}, {w: 6000, r: [247, 497, 748, 952]}, {w: 7000, r: [288, 567, 861, 1092]}, 
            {w: 8000, r: [329, 639, 972, 1234]}, {w: 9000, r: [370, 709, 1085, 1376]}, {w: 10000, r: [411, 779, 1196, 1518]}, 
            {w: 11000, r: [454, 851, 1309, 1600]}, {w: 12000, r: [495, 921, 1420, 1800]}, {w: 13000, r: [536, 993, 1533, 1942]}, 
            {w: 14000, r: [577, 1063, 1644, 2084]}, {w: 15000, r: [618, 1133, 1757, 2226]}, {w: 16000, r: [659, 1205, 1870, 2368]}, 
            {w: 17000, r: [700, 1275, 1981, 2508]}, {w: 18000, r: [743, 1275, 1994, 2550]}, {w: 19000, r: [743, 1347, 2094, 2650]}, 
            {w: 20000, r: [784, 1417, 2205, 2792]}, {w: 21000, r: [825, 1487, 2318, 2934]}, {w: 22000, r: [866, 1559, 2429, 3076]}, 
            {w: 23000, r: [907, 1629, 2542, 3216]}, {w: 24000, r: [948, 1701, 2653, 3358]}, {w: 25000, r: [991, 1771, 2766, 3500]}, 
            {w: 26000, r: [1032, 1841, 2879, 3642]}, {w: 27000, r: [1073, 1913, 2990, 3784]}, {w: 28000, r: [1114, 1983, 3103, 3924]}, 
            {w: 29000, r: [1155, 2055, 3214, 4066]}, {w: 30000, r: [1196, 2125, 3327, 4208]}, {w: 31000, r: [1237, 2195, 3438, 4350]}, 
            {w: 32000, r: [1280, 2267, 3551, 4492]}, {w: 33000, r: [1320, 2337, 3551, 4492]}, {w: 34000, r: [1362, 2409, 3775, 4774]}, 
            {w: 35000, r: [1404, 2449, 3886, 4916]}, {w: 999999, r: [1446, 2499, 3999, 5058]} // Represents 35000+
        ],
        // Speed Post Business (formerly contractual) from the original image setup
        speedPostBusiness: [
            {w: 500, r: [34, 42, 48, 55]}, {w: 1000, r: [37, 57, 77, 83]}, {w: 1500, r: [42, 76, 130, 178]}, 
            {w: 2000, r: [53, 105, 166, 224]}, {w: 3000, r: [67, 131, 224, 296]}, {w: 4000, r: [81, 157, 277, 359]}, 
            {w: 5000, r: [95, 184, 325, 414]}, {w: 6000, r: [114, 213, 395, 489]}, {w: 7000, r: [131, 244, 467, 566]}, 
            {w: 8000, r: [148, 273, 537, 643]}, {w: 9000, r: [167, 302, 607, 720]}, {w: 10000, r: [184, 331, 679, 797]}, 
            {w: 11000, r: [201, 362, 749, 874]}, {w: 12000, r: [220, 391, 821, 949]}, {w: 13000, r: [237, 420, 891, 1026]}, 
            {w: 14000, r: [254, 449, 961, 1103]}, {w: 15000, r: [273, 480, 1033, 1180]}, {w: 16000, r: [290, 509, 1103, 1257]}, 
            {w: 17000, r: [307, 538, 1175, 1334]}, {w: 18000, r: [326, 567, 1245, 1411]}, {w: 19000, r: [343, 598, 1315, 1486]}, 
            {w: 20000, r: [362, 627, 1387, 1563]}, {w: 21000, r: [379, 656, 1457, 1640]}, {w: 22000, r: [396, 685, 1529, 1717]}, 
            {w: 23000, r: [415, 716, 1599, 1794]}, {w: 24000, r: [432, 745, 1669, 1871]}, {w: 25000, r: [449, 774, 1741, 1948]}, 
            {w: 26000, r: [468, 803, 1811, 2023]}, {w: 27000, r: [485, 834, 1883, 2100]}, {w: 28000, r: [502, 863, 1953, 2177]}, 
            {w: 29000, r: [521, 892, 2023, 2254]}, {w: 30000, r: [538, 921, 2095, 2331]}, {w: 31000, r: [555, 952, 2165, 2408]}, 
            {w: 32000, r: [574, 981, 2237, 2483]}, {w: 33000, r: [591, 1010, 2307, 2560]}, {w: 34000, r: [608, 1039, 2377, 2637]}, 
            {w: 35000, r: [627, 1070, 2449, 2714]}
        ]
    };

    const destPinInput = document.getElementById('destPin');
    const originPinInput = document.getElementById('originPin');
    const zoneSelect = document.getElementById('zoneSelect');
    const pinStatus = document.getElementById('pinStatus');

    async function fetchPincodeDetails(pincode) {
        try {
            const res = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
            const data = await res.json();
            if (data && data[0].Status === "Success") return data[0].PostOffice[0];
        } catch (e) { console.error("API error", e); }
        return null;
    }

    async function evaluateZone() {
        const oPin = originPinInput.value.trim();
        const dPin = destPinInput.value.trim();
        
        if (dPin.length === 6 && oPin.length === 6) {
            pinStatus.innerHTML = "Looking up pincode details...";
            const oData = await fetchPincodeDetails(oPin);
            const dData = await fetchPincodeDetails(dPin);
            
            if (oData && dData) {
                pinStatus.innerHTML = `Destination: ${dData.District}, ${dData.State}`;
                
                if (oData.District === dData.District || oPin.substring(0,3) === dPin.substring(0,3)) {
                    zoneSelect.value = "0"; // Local
                } else if (oData.State === dData.State) {
                    zoneSelect.value = "1"; // Within State
                } else {
                    const metros = ["Delhi", "Mumbai", "Kolkata", "Chennai", "Bengaluru", "Hyderabad", "Bangalore"];
                    const isMetro = metros.some(m => dData.District.includes(m) || dData.Region.includes(m));
                    zoneSelect.value = isMetro ? "2" : "3"; // Zone/Metro OR Other States
                }
            } else {
                pinStatus.innerHTML = "Could not fetch details. Please select zone manually.";
            }
        } else if (dPin.length < 6) {
            pinStatus.innerHTML = "";
        }
    }

    destPinInput.addEventListener('input', evaluateZone);

    function getRate(weight, type, zoneIdx) {
        // Business limits out at 35000 exactly, Retail has a 35000+ tier mapped to 999999
        if (type === 'speedPostBusiness' && weight > 35000) return "N/A";
        
        const table = ratesData[type];
        const slab = table.find(row => weight <= row.w);
        return slab ? `₹${slab.r[zoneIdx]}` : "N/A";
    }

    function calculateRates() {
        const weight = parseInt(document.getElementById('weight').value);
        const zoneIdx = parseInt(document.getElementById('zoneSelect').value);
        const resultBox = document.getElementById('resultBox');
        
        if (!weight || weight <= 0) {
            alert("Please enter a valid parcel weight in grams.");
            return;
        }
        
        document.getElementById('resSpeedPostRetail').innerText = getRate(weight, 'speedPostRetail', zoneIdx);
        document.getElementById('resSpeedPostBusiness').innerText = getRate(weight, 'speedPostBusiness', zoneIdx);

        resultBox.style.display = "block";
    }
</script>

</body>
</html>
